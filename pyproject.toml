[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.pytest.ini_options]
pythonpath = [
    "src",  # Add the main project source to Python path
    "utils"  # Add the utils directory
]
# Configure asyncio for tests
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# Increase timeout for slow test operations
timeout = 300
# These filters help catch event loop and asyncio warnings
filterwarnings = [
    "error::RuntimeWarning:asyncio",  # Catch event loop issues
    "ignore:coroutine .* was never awaited:RuntimeWarning",  # Ignore common false positive
    "ignore::DeprecationWarning:passlib.*",  # Ignore passlib deprecation warnings
    "ignore::DeprecationWarning:openid.*",  # Ignore OpenID deprecation warnings
]

# This ensures utils can import from src/
[tool.hatch.build]
dev-mode-dirs = ["src"]

# Development dependencies
[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-env>=0.8.1",
    "coverage>=7.2.3",
    
    # Linting & Formatting
    "ruff>=0.5.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.2.0",
    "flake8>=6.0.0",
    "pylint>=2.17.3",
    
    # Type checking
    "types-redis>=4.5.5.1",
    "types-passlib>=1.7.7.12",
    "types-python-jose>=3.3.4.7",

    # Async development tools
    "watchfiles>=0.24.0",
]

test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

docs = [
    "sphinx>=6.2.1",
    "sphinx-rtd-theme>=1.2.1",
]

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["utils", "src"]

[tool.pylance]
python_version = "3.10"
exclude = [
    'src/migrations/',  # Exclude any paths you don't want to type check
]
ignore_missing_imports = true
check_untyped_defs = true

# Install the CLI tools
[project.scripts]
cs2-perms = "utils.permissions.cli:cli"

# Ruff linter configuration
[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
src = ["src", "utils", "test"]
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "__pycache__",
    "_build",
    "buck-out",
    "build",
    "dist",
    ".eggs",
    "venv",
    "env",
    "alembic/versions",  # Exclude migrations
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "PL",     # pylint
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ASYNC",  # flake8-async
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "PLR0915", # too many statements
    "PLR0916", # too many branches
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0914", # too many locals
    "PLW0603", # global statement
    "N805",    # first argument of a method should be named self
    "UP007",   # use | for union types
    "B008",    # function calls in argument defaults
    "B006",    # mutable default arguments (common in SQLModel)
    "PLC0415", # import outside top-level
    "PLW2901", # outer loop variable overwritten by inner loop
    "PLR5501", # else-if-return
    "N802",    # function name should be lowercase
    "PERF401", # list comprehension to join - not always better
]

fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["auth", "teams", "competitions", "maps", "matches", "audit", "status", "src"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Ignore certain rules in specific files
"test/**/*.py" = [
    "ARG001",  # unused arguments (common in test fixtures)
    "ARG002",  # unused arguments
    "PLR2004", # magic values (common in tests)
    "PLR0914", # too many locals (tests can be complex)
    "SIM117",  # multiple contexts (fine in tests)
]
"alembic/**/*.py" = [
    "UP",      # don't upgrade alembic scripts
    "N999",    # invalid module name
]
"src/**/schemas.py" = [
    "N805",    # first argument of a method should be named self (validators)
]
"src/**/routes.py" = [
    "ARG001",  # unused arguments (common in FastAPI dependency injection)
]
"src/main.py" = [
    "ARG001",  # unused arguments (FastAPI lifecycle handlers)
]
"utils/**/*.py" = [
    "T10",     # allow print/debugger in utility scripts
    "ARG001",  # unused arguments in utility scripts
    "ARG002",  # unused method arguments in utility scripts
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

# MyPy type checking configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true
disallow_untyped_decorators = false
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin"
]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "alembic.*"
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "aiofiles.*",
    "faker.*",
    "pytest.*"
]
ignore_missing_imports = true
